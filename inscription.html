<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscription — CodeNost</title><link rel="stylesheet" href="assets/css/site.css"></head><body>
<header class="topbar"><a class="brand" href="index.html">CodeNost</a><a class="back" href="index.html"><i data-lucide="arrow-left"></i> back</a></header>
<main class="auth-layout">
  <section class="auth-panel">
    <h1>Inscription</h1>
    <div class="oauth-row">
      <button class="oauth-btn"><i data-lucide="github"></i> GitHub</button>
      <button class="oauth-btn"><i data-lucide="chrome"></i> Google</button>
    </div>
    <form class="form" onsubmit="return false">
      <label>Adresse e-mail<input type="email" placeholder="adresse@email.fr"></label>
      <label>Mot de passe
        <div class="password-field">
          <input id="signup-password" type="password" placeholder="Mot de passe">
          <button class="password-toggle" type="button" data-toggle-password="signup-password" aria-label="Afficher le mot de passe"><i data-lucide="eye"></i></button>
        </div>
      </label>
      <label>Confirme
        <div class="password-field">
          <input id="signup-confirm" type="password" placeholder="Confirme le mot de passe">
          <button class="password-toggle" type="button" data-toggle-password="signup-confirm" aria-label="Afficher le mot de passe"><i data-lucide="eye"></i></button>
        </div>
      </label>
      <label class="remember"><input type="checkbox"> Je reste connecté</label>
      <button class="button primary full" type="submit">Inscription</button>
    </form>
    <p class="switch-note">Déjà inscrit ? <a href="connexion.html">Connexion</a></p>
  </section>
  <section class="auth-panel">
    <h1>CodeNost</h1>
    <p class="hero-text">Un seul compte pour tes projets, tes préférences et les futurs outils CodeNost.</p>
  </section>
</main>
<script src="https://unpkg.com/lucide@latest"></script><script src="assets/js/site.js"></script><script>lucide.createIcons();</script>
</body></html>
