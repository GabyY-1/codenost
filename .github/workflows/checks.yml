name: CodeNost checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app/electron/main.js
      - run: node --check app/electron/preload.js
      - run: node --check app/electron/project-service.js
      - run: node --check app/src/js/icons.js
      - run: node --check app/src/js/ui.js
      - run: node --check app/src/js/projects.js
      - run: node --check app/src/js/editor.js
      - run: node --check app/src/js/app.js
